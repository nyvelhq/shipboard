version: "3.8"
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: shipboard
      POSTGRES_PASSWORD: shipboard
      POSTGRES_DB: shipboard
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # S3-compatible object storage for local testing of STORAGE_DRIVER=s3
  # (see apps/api/.env.example). Not needed when STORAGE_DRIVER=local.
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: shipboard
      MINIO_ROOT_PASSWORD: shipboard-local-dev
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
