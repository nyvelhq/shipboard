version: "3.8"
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: shipboard
      POSTGRES_PASSWORD: shipboard
      POSTGRES_DB: shipboard
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # S3-compatible object storage for local testing of STORAGE_DRIVER=s3
  # (see apps/api/.env.example). Not needed when STORAGE_DRIVER=local.
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: shipboard
      MINIO_ROOT_PASSWORD: shipboard-local-dev
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  # SMTP capture for local testing of EMAIL_DRIVER=smtp (see
  # apps/api/.env.example) — invite emails land here instead of a real
  # inbox. Web UI at http://localhost:8025. Not needed when
  # EMAIL_DRIVER=console.
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  pgdata:
  miniodata:
